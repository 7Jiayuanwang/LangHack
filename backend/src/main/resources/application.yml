server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    threads:
      max: 500
      min-spare: 50
    accept-count: 200
    max-connections: 8192
    connection-timeout: 20000

spring:
  application:
    name: english-learning-platform

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    master:
      # CRITICAL: DB credentials MUST be provided via environment variables in production
      # Local dev: DB_URL, DB_USERNAME, DB_PASSWORD (with safe defaults)
      # Production: MUST be set via environment variables, no defaults
      jdbc-url: ${DB_URL:jdbc:mysql://localhost:3306/english_learning?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:root}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        auto-commit: true
        leak-detection-threshold: 60000
        # Connection pool security: enforce SSL in production
        ssl-mode: ${DB_SSL_MODE:}
    slave:
      # Fallback to master when slave not configured (single-instance deployment)
      jdbc-url: ${DB_SLAVE_URL:jdbc:mysql://localhost:3306/english_learning?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
      username: ${DB_SLAVE_USERNAME:${DB_USERNAME:root}}
      password: ${DB_SLAVE_PASSWORD:${DB_PASSWORD:root}}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 50
        minimum-idle: 10
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        auto-commit: true
        read-only: true

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3000
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: 1000

  cache:
    type: redis
    redis:
      time-to-live: 600000

  security:
    jwt:
      # CRITICAL: JWT_SECRET MUST be provided via environment variable
      # - Minimum 32 characters (256-bit for HS256)
      # - Must be a cryptographically secure random value
      # - Never hardcode in source code or configuration files
      # - Production deployment: Generate with: openssl rand -base64 32
      secret: ${JWT_SECRET}
      expiration: 86400000 # 24小时

  flyway:
    enabled: false  # Flyway disabled (manual database migration management)
    baseline-on-migrate: false
    locations: classpath:db/migration
    group: true
    out-of-order: true # Allow out-of-order migration file execution for Java migrations
    validate-on-migrate: false # Disable validation to resolve Checksum mismatch from manual fixes

media:
  upload:
    max-image-size: 10485760   # 10 MB (bytes)
    max-video-size: 104857600  # 100 MB (bytes)

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

openrouter:
  # CRITICAL: API credentials MUST be provided via environment variable in production
  # - OPENROUTER_API_KEY must be set before application startup
  # - Rate limiting should be enforced at API level
  # - Monitor API usage for abuse patterns
  api-key: ${OPENROUTER_API_KEY}
  api-url: https://openrouter.ai/api/v1/chat/completions
  model: tngtech/deepseek-r1t2-chimera:free
  timeout: 60000
  max-retries: 3


# Tencent Cloud API Configuration
tencent:
  translate:
    # CRITICAL: Credentials MUST be provided via environment variables
    # - TENCENT_SECRET_ID: Tencent Cloud secret ID
    # - TENCENT_SECRET_KEY: Tencent Cloud secret key
    # - Leave empty for local development if translation service not used
    secret-id: ${TENCENT_SECRET_ID:}
    secret-key: ${TENCENT_SECRET_KEY:}
    region: ap-guangzhou  # Region: Guangzhou by default
  asr:
    # CRITICAL: Credentials MUST be provided via environment variables
    # - TENCENT_ASR_SECRET_ID: Tencent Cloud secret ID for ASR
    # - TENCENT_ASR_SECRET_KEY: Tencent Cloud secret key for ASR
    # - Leave empty for local development if ASR service not used
    secret-id: ${TENCENT_ASR_SECRET_ID:}
    secret-key: ${TENCENT_ASR_SECRET_KEY:}
    region: ${TENCENT_ASR_REGION:ap-guangzhou}  # Region: Guangzhou by default

async:
  version-generator:
    core-pool-size: 8
    max-pool-size: 32
    queue-capacity: 200

backup:
  enabled: ${BACKUP_ENABLED:true}
  dir: ${BACKUP_DIR:./backups}
  cron: ${BACKUP_CRON:0 0 2 * * ?}
  retention-days: ${BACKUP_RETENTION_DAYS:30}
  max-count: ${BACKUP_MAX_COUNT:50}
  mysqldump-path: ${MYSQLDUMP_PATH:mysqldump}
  incremental:
    enabled: ${BACKUP_INCREMENTAL_ENABLED:false}
    full-backup-interval-days: ${BACKUP_FULL_INTERVAL_DAYS:7}

resilience4j:
  circuitbreaker:
    instances:
      openrouter:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
      tencent-translate:
        failure-rate-threshold: 60
        wait-duration-in-open-state: 20s
        sliding-window-size: 8
        minimum-number-of-calls: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.english: info
    org.springframework.security: error
    org.springframework.web: error
    org.mybatis: error
    root: error
