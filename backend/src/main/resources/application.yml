app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:*,http://localhost:*}
    # 允许局域网IP访问（手机测试）
    allowed-origin-patterns: http://192.168.*.*:3000,http://172.*.*.*:3000,http://10.*.*.*:3000
  update:
    supported: ${APP_UPDATE_SUPPORTED:true}
    unsupported-reason: ${APP_UPDATE_UNSUPPORTED_REASON:Self-update is not supported in the current deployment mode.}
    hot-deploy-script: scripts/hot-deploy.sh
    docker-socket: ${APP_UPDATE_DOCKER_SOCKET:/var/run/docker.sock}
    project-host-path: ${PROJECT_HOST_PATH:}
    deployer-image: ${APP_UPDATE_DEPLOYER_IMAGE:langhack-deployer:latest}
    git-token: ${GIT_TOKEN:}
    git-ssh-key-dir: ${GIT_SSH_KEY_DIR:}
  base-url: ${APP_BASE_URL:http://localhost:3000}

# 管理员登录配置
admin:
  login:
    secret: ${ADMIN_LOGIN_SECRET:default-secret}


server:
  port: 8080
  server-header: ""
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: false
  tomcat:
    redirect-context-root: false
    remoteip:
      # 信任负载均衡的 X-Forwarded-* 头，使 sendRedirect 等生成 https:// URL
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}
      protocol-header: X-Forwarded-Proto
      host-header: X-Forwarded-Host
    threads:
      max: 500
      min-spare: 50
    accept-count: 200
    max-connections: 8192
    connection-timeout: 600000
    max-swallow-size: -1
    max-http-post-size: -1

spring:
  application:
    name: english-learning-platform

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:100GB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:100GB}

  datasource:
    master:
      # CRITICAL: DB credentials MUST be provided via environment variables
      # Local dev: set DB_URL, DB_USERNAME, DB_PASSWORD in your environment or .env file
      # Production: MUST be set via environment variables, no defaults
      jdbc-url: ${DB_URL:jdbc:mysql://localhost:3306/english_learning?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&allowMultiQueries=true}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver
      # HikariCP pool settings (must be at same level for @ConfigurationProperties binding)
      pool-name: master-pool
      maximum-pool-size: 60
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      auto-commit: true
      leak-detection-threshold: 300000
      # Connection pool security: enforce SSL in production
      ssl-mode: ${DB_SSL_MODE:}
    slave:
      # Fallback to master when slave not configured (single-instance deployment)
      jdbc-url: ${DB_SLAVE_URL:jdbc:mysql://localhost:3306/english_learning?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true&allowMultiQueries=true}
      username: ${DB_SLAVE_USERNAME:${DB_USERNAME}}
      password: ${DB_SLAVE_PASSWORD:${DB_PASSWORD}}
      driver-class-name: com.mysql.cj.jdbc.Driver
      # HikariCP pool settings (must be at same level for @ConfigurationProperties binding)
      pool-name: slave-pool
      maximum-pool-size: 120
      minimum-idle: 30
      connection-timeout: 30000
      # -1 = do not fail startup if slave is unreachable; DynamicDataSource handles fallback
      initialization-fail-timeout: -1
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      auto-commit: true
      read-only: true
      leak-detection-threshold: 300000

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3000
    lettuce:
      pool:
        max-active: 32
        max-idle: 16
        min-idle: 4
        max-wait: 2000

  cache:
    type: redis
    redis:
      time-to-live: 600000

  security:
    jwt:
      # CRITICAL: JWT_SECRET MUST be provided via environment variable
      # - Minimum 32 characters (256-bit for HS256)
      # - Must be a cryptographically secure random value
      # - Never hardcode in source code or configuration files
      # - Production deployment: Generate with: openssl rand -base64 32
      secret: ${JWT_SECRET:your_dummy_jwt_secret_for_local_development_at_least_32_chars_long}
      expiration: 2592000000 # 30天 (30 * 24 * 60 * 60 * 1000)

  flyway:
    enabled: false  # Flyway disabled (manual database migration management)
    baseline-on-migrate: false
    locations: classpath:db/migration
    group: true
    out-of-order: true # Allow out-of-order migration file execution for Java migrations
    validate-on-migrate: false # Disable validation to resolve Checksum mismatch from manual fixes

media:
  upload:
    max-image-size: ${MEDIA_UPLOAD_MAX_IMAGE_SIZE:10485760}   # 默认 10 MB
    max-video-size: ${MEDIA_UPLOAD_MAX_VIDEO_SIZE:536870912}  # 默认 512 MB
    storage-path: ${MEDIA_UPLOAD_STORAGE_PATH:/app/uploads}   # 视频文件存储路径
  transcode:
    enabled: ${MEDIA_TRANSCODE_ENABLED:true}                  # 总开关：关闭后所有视频走 SKIPPED
    ffmpeg-path: ${MEDIA_TRANSCODE_FFMPEG:ffmpeg}             # ffmpeg 可执行文件路径（容器内 PATH 中）
    ffprobe-path: ${MEDIA_TRANSCODE_FFPROBE:ffprobe}          # ffprobe 可执行文件路径
    target-resolution-height: ${MEDIA_TRANSCODE_TARGET_H:1080} # 目标最大高度（仅缩小不放大）
    preset: ${MEDIA_TRANSCODE_PRESET:medium}                  # libx264 preset：ultrafast..veryslow
    crf: ${MEDIA_TRANSCODE_CRF:23}                            # 质量 18(高)-28(低)，23 为合理默认
    timeout-minutes: ${MEDIA_TRANSCODE_TIMEOUT_MIN:30}        # 单任务超时（分钟），超时强杀
    max-concurrent: ${MEDIA_TRANSCODE_CONCURRENT:1}           # 同时并行任务数
    queue-capacity: ${MEDIA_TRANSCODE_QUEUE:50}               # 队列容量，满后调用线程跑（背压）

recommendation:
  weight:
    item-cf: 0.6
    user-cf: 0.4
  similarity:
    text-threshold: 0.2
    user-threshold: 0.3
  cold-start:
    min-reads: 3
  user-cf:
    min-score: 0.5
    per-user-limit: 10
  item-cf:
    per-seed-limit: 20
  persona:
    enabled: ${RECOMMENDATION_PERSONA_ENABLED:false}
    max-adjustment: 0.12

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/**/*.xml

hiagent:
  #此处禁止删除
  # HiAgent Native API Settings（AI 改写应用：CET-4/6/学术版/中英对照）
  api-key: ${HIAGENT_API_KEY:}
  api-url: ${HIAGENT_API_URL:https://agent.imau.edu.cn:32300/api/proxy/api/v1}
  app-id: ${HIAGENT_APP_ID:}
  user-id: ${HIAGENT_USER_ID:LangHack_System}

  # HiAgent Q&A App（AI 问答应用：文章划词 AI 问答）
  # 必须与改写凭证（api-key/app-id）使用完全不同的 HiAgent 应用凭证
  # 未配置时 AI 问答功能不可用（改写功能不受影响）
  qa-api-key: ${HIAGENT_QA_API_KEY:}
  qa-app-id: ${HIAGENT_QA_APP_ID:}

  timeout: 180000
  max-retries: 3

openrouter:
  # OpenAI-compatible API flow (fallback AI provider)
  api-url: ${OPENROUTER_API_URL:https://openrouter.ai/api/v1/chat/completions}
  # CRITICAL: Must be provided via environment variable (no real key in defaults)
  api-key: ${OPENROUTER_API_KEY:}
  model: ${OPENROUTER_MODEL:tngtech/deepseek-r1t2-chimera:free}
  timeout: 60000


# Tencent Cloud API Configuration
tencent:
  asr:
    # CRITICAL: Credentials MUST be provided via environment variables
    # - TENCENT_ASR_SECRET_ID: Tencent Cloud secret ID for ASR
    # - TENCENT_ASR_SECRET_KEY: Tencent Cloud secret key for ASR
    # - Leave empty for local development if ASR service not used
    secret-id: ${TENCENT_ASR_SECRET_ID:}
    secret-key: ${TENCENT_ASR_SECRET_KEY:}
    region: ${TENCENT_ASR_REGION:ap-guangzhou}  # Region: Guangzhou by default

# AI Translation (OpenAI-compatible API, default: SiliconFlow Qwen2.5-7B)
# Priority: DB system_config > these env vars > code defaults
ai:
  translate:
    api-url: ${AI_TRANSLATE_API_URL:https://api.siliconflow.cn/v1/chat/completions}
    api-key: ${AI_TRANSLATE_API_KEY:}
    model: ${AI_TRANSLATE_MODEL:Qwen/Qwen2.5-7B-Instruct}
    timeout: ${AI_TRANSLATE_TIMEOUT:30000}

async:
  version-generator:
    core-pool-size: 8
    max-pool-size: 32
    queue-capacity: 200

backup:
  enabled: ${BACKUP_ENABLED:true}
  dir: ${BACKUP_DIR:./backups}
  cron: ${BACKUP_CRON:0 0 2 * * ?}
  retention-days: ${BACKUP_RETENTION_DAYS:30}
  max-count: ${BACKUP_MAX_COUNT:50}
  mysqldump-path: ${MYSQLDUMP_PATH:mysqldump}
  incremental:
    enabled: ${BACKUP_INCREMENTAL_ENABLED:false}
    full-backup-interval-days: ${BACKUP_FULL_INTERVAL_DAYS:7}

resilience4j:
  circuitbreaker:
    instances:
      hiagent:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        ignore-exceptions:
          - com.english.exception.BusinessException
      openrouter:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
        ignore-exceptions:
          - com.english.exception.BusinessException
      tencent-translate:
        failure-rate-threshold: 60
        wait-duration-in-open-state: 20s
        sliding-window-size: 8
        minimum-number-of-calls: 3
      hiagent-qa:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        sliding-window-size: 5
        minimum-number-of-calls: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.english: info
    org.springframework.security: error
    org.springframework.web: error
    org.mybatis: error
    root: error
  file:
    name: ${LOG_FILE:logs/spring.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7
      total-size-cap: 200MB

# School Data Integration Configuration
# Supports two access modes: api (REST) or etl (JDBC)
school:
  data:
    source: ${SCHOOL_DATA_SOURCE:api}
    api:
      base-url: ${SCHOOL_API_BASE_URL:https://api.imau.edu.cn}
      # 官方认证方式: appId + appSecret 签名
      # sign = Base64(MD5(appId + appSecret + timestamp))
      # 请求头: appId / timestamp / sign
      app-id: ${SCHOOL_API_APP_ID:}
      app-secret: ${SCHOOL_API_APP_SECRET:}
      connect-timeout: ${SCHOOL_API_CONNECT_TIMEOUT:5000}
      read-timeout: ${SCHOOL_API_READ_TIMEOUT:30000}
      retry-attempts: ${SCHOOL_API_RETRY_ATTEMPTS:3}
    etl:
      jdbc-url: ${SCHOOL_ETL_JDBC_URL:jdbc:mysql://school-db.imau.edu.cn:3306/school_db}
      username: ${SCHOOL_ETL_USERNAME:}
      password: ${SCHOOL_ETL_PASSWORD:}
      driver-class-name: ${SCHOOL_ETL_DRIVER:com.mysql.cj.jdbc.Driver}
      connection-timeout: ${SCHOOL_ETL_CONNECTION_TIMEOUT:30000}
      query-timeout: ${SCHOOL_ETL_QUERY_TIMEOUT:60000}
    sync:
      enabled: ${SCHOOL_SYNC_ENABLED:false}
      full-sync-cron: ${SCHOOL_SYNC_FULL_CRON:0 0 2 * * ?}
      incremental-sync-cron: ${SCHOOL_SYNC_INCREMENTAL_CRON:0 0 * * * ?}
      validation-cron: ${SCHOOL_SYNC_VALIDATION_CRON:0 0 4 * * ?}
      batch-size: ${SCHOOL_SYNC_BATCH_SIZE:500}
      sync-timeout-minutes: ${SCHOOL_SYNC_TIMEOUT_MINUTES:60}
      full-sync-on-startup: ${SCHOOL_SYNC_FULL_ON_STARTUP:false}
    cli:
      enabled: ${SCHOOL_DATA_CLI_ENABLED:false}

# 学习者画像
learner-profile:
  enabled: ${LEARNER_PROFILE_ENABLED:true}
  tracking:
    enabled: ${LEARNER_PROFILE_TRACKING_ENABLED:false}
  snapshot:
    enabled: ${LEARNER_PROFILE_SNAPSHOT_ENABLED:false}
  llm-summary:
    enabled: ${LEARNER_PROFILE_LLM_SUMMARY_ENABLED:false}
