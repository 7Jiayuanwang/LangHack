server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    threads:
      max: 500
      min-spare: 50
    accept-count: 200
    max-connections: 8192
    connection-timeout: 20000

spring:
  application:
    name: english-learning-platform

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    master:
      jdbc-url: ${DB_URL:jdbc:mysql://localhost:3306/english_learning?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:root}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 20
        minimum-idle: 5
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        auto-commit: true
        leak-detection-threshold: 60000
    slave:
      # 未配置从库时，默认回退到主库（单机部署两者指向同一实例）
      jdbc-url: ${DB_SLAVE_URL:jdbc:mysql://localhost:3306/english_learning?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
      username: ${DB_SLAVE_USERNAME:${DB_USERNAME:root}}
      password: ${DB_SLAVE_PASSWORD:${DB_PASSWORD:root}}
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 50
        minimum-idle: 10
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        auto-commit: true
        read-only: true

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3000
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: 1000

  cache:
    type: redis
    redis:
      time-to-live: 600000

  security:
    jwt:
      secret: ${JWT_SECRET:your_dummy_jwt_secret_for_local_development_at_least_32_chars_long}
      expiration: 86400000 # 24小时

  flyway:
    enabled: false  # Flyway 禁用（手动管理数据库迁移）
    baseline-on-migrate: false
    locations: classpath:db/migration
    group: true
    out-of-order: true # 允许乱序执行迁移文件，方便插入 Java 迁移
    validate-on-migrate: false # 禁用校验，解决手动修复历史记录导致的 Checksum 不匹配问题

media:
  upload:
    max-image-size: 10485760   # 10 MB，单位：字节
    max-video-size: 104857600  # 100 MB，单位：字节

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml

openrouter:
  api-key: ${OPENROUTER_API_KEY:dummy_key}
  api-url: https://openrouter.ai/api/v1/chat/completions
  model: tngtech/deepseek-r1t2-chimera:free
  timeout: 60000
  max-retries: 3

# 腾讯翻译配置
tencent:
  translate:
    secret-id: ${TENCENT_SECRET_ID:}
    secret-key: ${TENCENT_SECRET_KEY:}
    region: ap-guangzhou  # 地域，默认广州

async:
  version-generator:
    core-pool-size: 4
    max-pool-size: 12
    queue-capacity: 50

resilience4j:
  circuitbreaker:
    instances:
      openrouter:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        sliding-window-size: 10
        minimum-number-of-calls: 5
      tencent-translate:
        failure-rate-threshold: 60
        wait-duration-in-open-state: 20s
        sliding-window-size: 8
        minimum-number-of-calls: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.english: info
    org.springframework.security: error
    org.springframework.web: error
    org.mybatis: error
    root: error
