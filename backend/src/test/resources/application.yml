spring:
  profiles:
    active: test
  datasource:
    master:
      jdbc-url: ${DB_URL:jdbc:mysql://localhost:3306/english_learning?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
    slave:
      jdbc-url: ${DB_URL:jdbc:mysql://localhost:3306/english_learning?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}
      driver-class-name: com.mysql.cj.jdbc.Driver
  security:
    jwt:
      secret: ${JWT_SECRET:test-secret-key-at-least-32-characters-long-for-testing}
      expiration: 2592000000
  flyway:
    enabled: true
    url: ${DB_URL:jdbc:mysql://localhost:3306/english_learning?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true}
    user: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
  main:
    allow-bean-definition-overriding: true
  cache:
    type: none
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

# 测试环境禁用 SSO
sso:
  enabled: false

# 测试环境禁用备份调度
backup:
  enabled: false

# 测试环境禁用学校数据同步调度
school:
  data:
    sync:
      enabled: false
