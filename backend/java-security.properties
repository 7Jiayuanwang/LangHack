# LangHack Custom Java Security Properties
#
# This file is loaded via -Djava.security.properties=/app/java-security.properties
# Only overridden keys take effect; all other JRE defaults are preserved.
#
# Purpose: Allow rsa_pkcs1_sha1 in TLS handshake.
# The CAS server (ids.imau.edu.cn) uses this deprecated signature algorithm
# in its ECDH ServerKeyExchange message. Java 17+ disables it by default,
# causing SSLHandshakeException. We remove it from the disabled list while
# keeping all other security restrictions intact.

# JDK 17 default jdk.tls.disabledAlgorithms with rsa_pkcs1_sha1 removed:
jdk.tls.disabledAlgorithms=SSLv3, TLSv1, TLSv1.1, DTLSv1.0, RC4, DES, \
    MD5withRSA, DH keySize < 1024, EC keySize < 224, 3DES_EDE_CBC, anon, \
    NULL, ECDH, include jdk.disabled.namedCurves, \
    ecdsa_sha1 usage HandshakeSignature, \
    dsa_sha1 usage HandshakeSignature
