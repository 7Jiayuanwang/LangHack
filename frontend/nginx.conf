# ── CORS origin validation (whitelist local dev + LAN IPs) ──────────────────
# Must be at http level; this file is included from the http block
map $http_origin $cors_origin {
    default "";
    "~^http://localhost(:[0-9]+)?$" $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
    "~^http://192\.168\.[0-9]+\.[0-9]+(:[0-9]+)?$" $http_origin;
    "~^http://172\.(1[6-9]|2[0-9]|3[0-1])\.[0-9]+\.[0-9]+(:[0-9]+)?$" $http_origin;
    "~^http://10\.[0-9]+\.[0-9]+\.[0-9]+(:[0-9]+)?$" $http_origin;
}

server {
    listen       80;
    server_name  localhost;
    client_max_body_size 512M;
    server_tokens        off;

    # ── 维护模式 ─────────────────────────────────────────────────────────────
    # 当 maintenance.flag 存在时，所有请求返回 503 维护页面
    # 开启: docker compose exec -T frontend touch /usr/share/nginx/html/maintenance.flag
    # 关闭: docker compose exec -T frontend rm -f /usr/share/nginx/html/maintenance.flag

    error_page 503 @maintenance;
    location @maintenance {
        root /usr/share/nginx/html;
        rewrite ^(.*)$ /maintenance.html break;
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    if (-f /usr/share/nginx/html/maintenance.flag) {
        return 503;
    }

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;

    # ── Security response headers ─────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Font MIME types ───────────────────────────────────────────────────────
    # 注意：不在 server 块内定义 types{} 覆盖块 —— 那会替换全局 MIME 类型表
    # 导致 HTML/JS/CSS 全部变成 application/octet-stream（浏览器触发下载）。
    # nginx:alpine 的 /etc/nginx/mime.types 已包含所有标准类型，此处无需重复定义。

    # ── Serve static frontend files ───────────────────────────────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # SPA fallback: Vue History Router refresh support
        try_files $uri $uri/ /index.html;

        # index.html: no-cache so clients always get the latest entry point
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache"                            always;
            add_header Expires       "0"                                   always;
            # Re-apply security headers inside nested location
            add_header X-Content-Type-Options  "nosniff"       always;
            add_header X-Frame-Options         "SAMEORIGIN"    always;
            add_header X-XSS-Protection        "1; mode=block" always;
        }
    }

    # ── Hashed static assets: long-lived immutable cache ─────────────────────
    # Vite outputs assets with content-hash filenames (e.g. main.a1b2c3d4.js)
    location /assets/ {
        root  /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Re-apply security headers inside nested location
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header X-XSS-Protection        "1; mode=block" always;
        try_files $uri =404;
    }

    # ── 备份接口（大文件上传/下载/恢复，长超时，流式传输）────────────────
    location ~ ^/api/ops/backup/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;            # 禁用缓冲，流式传输
        proxy_request_buffering off;
        proxy_read_timeout 3600s;          # 1 小时超时，支持大文件上传/下载
        proxy_send_timeout 3600s;
        client_max_body_size 2048M;        # 允许上传最大 2GB 备份文件
    }

    # ── Proxy API requests to backend container ───────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # Disable proxy buffering for SSE / streaming AI responses
        proxy_buffering    off;
        proxy_read_timeout 300s;

        # CORS preflight (OPTIONS) — return immediately to skip backend CORS issues
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Accept, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 3600 always;
            return 204;
        }

        # Add CORS origin to all proxied responses
        add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
    }

    # ── 学校数据同步接口（链式拉取 / 全量同步可能跑 30-60 分钟）────────────────
    location ~ ^/api/admin/sync/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Webhook proxy (container → host webhook listener) ────────────────────
    location /webhook/ {
        proxy_pass         http://host.docker.internal:9000/webhook/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # ── Proxy AI Tutor API requests ────────────────────────────────────────
    # Routes /tutor requests to backend (which proxies to external tutor server)
    # If tutor server is not configured, backend returns 404
    location /tutor/ {
        proxy_pass         http://backend:8080/tutor/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page   500 502 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
