server {
    listen       80;
    server_name  localhost;

    # ── 维护模式 ─────────────────────────────────────────────────────────────
    # 当 maintenance.flag 存在时，所有请求返回 503 维护页面
    # 开启: docker compose exec -T frontend touch /usr/share/nginx/html/maintenance.flag
    # 关闭: docker compose exec -T frontend rm -f /usr/share/nginx/html/maintenance.flag

    error_page 503 @maintenance;
    location @maintenance {
        root /usr/share/nginx/html;
        rewrite ^(.*)$ /maintenance.html break;
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    if (-f /usr/share/nginx/html/maintenance.flag) {
        return 503;
    }

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ── Security response headers ─────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Font MIME types ───────────────────────────────────────────────────────
    types {
        font/woff   woff;
        font/woff2  woff2;
        font/ttf    ttf;
        font/otf    otf;
    }

    # ── Serve static frontend files ───────────────────────────────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # SPA fallback: Vue History Router refresh support
        try_files $uri $uri/ /index.html;

        # index.html: no-cache so clients always get the latest entry point
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache"                            always;
            add_header Expires       "0"                                   always;
            # Re-apply security headers inside nested location
            add_header X-Content-Type-Options  "nosniff"       always;
            add_header X-Frame-Options         "SAMEORIGIN"    always;
            add_header X-XSS-Protection        "1; mode=block" always;
        }
    }

    # ── Hashed static assets: long-lived immutable cache ─────────────────────
    # Vite outputs assets with content-hash filenames (e.g. main.a1b2c3d4.js)
    location /assets/ {
        root  /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Re-apply security headers inside nested location
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header X-XSS-Protection        "1; mode=block" always;
        try_files $uri =404;
    }

    # ── Proxy API requests to backend container ───────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Disable proxy buffering for SSE / streaming AI responses
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    # ── Webhook proxy (container → host webhook listener) ────────────────────
    location /webhook/ {
        proxy_pass         http://host.docker.internal:9000/webhook/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page   500 502 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
