<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统维护中 - LangHack</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
    color: #fff;
  }

  .container {
    text-align: center;
    padding: 2rem;
    max-width: 520px;
  }

  /* Animated gear icon */
  .icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 1.5rem;
    animation: spin 4s linear infinite;
  }

  .icon svg {
    width: 100%;
    height: 100%;
    fill: rgba(255, 255, 255, 0.9);
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  h1 {
    font-size: 1.8rem;
    font-weight: 600;
    margin-bottom: 1rem;
    letter-spacing: 0.02em;
  }

  p {
    font-size: 1.05rem;
    line-height: 1.7;
    opacity: 0.9;
    margin-bottom: 0.5rem;
  }

  .hint {
    margin-top: 2rem;
    font-size: 0.9rem;
    opacity: 0.7;
  }

  /* Pulsing dots */
  .dots span {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin: 0 3px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.8);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="icon">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
    </svg>
  </div>

  <h1>系统维护中</h1>
  <p>我们正在进行系统更新，请稍后再访问。</p>
  <p>维护通常在几分钟内完成。</p>

  <div class="hint">
    <div class="dots">
      <span></span><span></span><span></span>
    </div>
    <p>更新完成后页面将自动恢复</p>
  </div>
</div>

<script>
// Auto-refresh every 15 seconds to detect when maintenance ends
setTimeout(function check() {
  fetch(window.location.href, { method: 'HEAD', cache: 'no-store' })
    .then(function(r) { if (r.ok) window.location.reload(); else setTimeout(check, 15000); })
    .catch(function() { setTimeout(check, 15000); });
}, 15000);
</script>
</body>
</html>
