# LangHack Nginx HTTPS 配置
# 由部署向导通过 docker-compose.override.yml 自动挂载
# 替代默认 nginx.conf，提供 HTTP→HTTPS 重定向 + SSL 终止
# 要求: 证书挂载到 /etc/nginx/ssl/{fullchain,privkey}.pem

# ── HTTP → HTTPS 重定向 ─────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # 维护模式优先（维护期间直接返回维护页面，不跳转 HTTPS）
    error_page 503 @maintenance;
    location @maintenance {
        root /usr/share/nginx/html;
        rewrite ^(.*)$ /maintenance.html break;
    }
    location = /maintenance.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    if (-f /usr/share/nginx/html/maintenance.flag) {
        return 503;
    }

    # 所有 HTTP 请求重定向到 HTTPS
    return 301 https://$host$request_uri;
}

# ── HTTPS 主服务 ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    # ── SSL 配置 ──────────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 隐藏 Nginx 版本号 ─────────────────────────────────────────────────────
    server_tokens off;

    # ── 维护模式 ─────────────────────────────────────────────────────────
    error_page 503 @maintenance;
    location @maintenance {
        root /usr/share/nginx/html;
        rewrite ^(.*)$ /maintenance.html break;
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    if (-f /usr/share/nginx/html/maintenance.flag) {
        return 503;
    }

    # ── Gzip compression ─────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;

    # ── Security response headers ─────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "SAMEORIGIN"      always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Serve static frontend files ───────────────────────────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # SPA fallback: Vue History Router refresh support
        try_files $uri $uri/ /index.html;

        # index.html: no-cache so clients always get the latest entry point
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma        "no-cache"                            always;
            add_header Expires       "0"                                   always;
            # Re-apply security headers inside nested location
            add_header X-Content-Type-Options  "nosniff"       always;
            add_header X-Frame-Options         "SAMEORIGIN"    always;
            add_header X-XSS-Protection        "1; mode=block" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }
    }

    # ── Hashed static assets: long-lived immutable cache ─────────────────
    # Vite outputs assets with content-hash filenames (e.g. main.a1b2c3d4.js)
    location /assets/ {
        root  /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Re-apply security headers inside nested location
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # ── Proxy API requests to backend container ───────────────────────────
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Disable proxy buffering for SSE / streaming AI responses
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # ── 学校数据同步接口（链式拉取 / 全量同步可能跑 30-60 分钟）────────────
    location ~ ^/api/admin/sync/ {
        proxy_pass         http://backend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Webhook proxy (container → host webhook listener) ────────────────
    location /webhook/ {
        proxy_pass         http://host.docker.internal:9000/webhook/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # ── Proxy AI Tutor API requests ────────────────────────────────────────
    # Routes /tutor requests to backend (which proxies to external tutor server)
    # If tutor server is not configured, backend returns 404
    location /tutor/ {
        proxy_pass         http://backend:8080/tutor/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 120s;
    }

    # ── Error pages ───────────────────────────────────────────────────────
    error_page   500 502 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
