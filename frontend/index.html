<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>LangHack</title>
   <style>
.achievement-mask {
position: fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
display:flex;
align-items:center;
justify-content:center;
z-index:99999;
display:none;
}
.ach-box {
background:#fff;
padding:35px 40px;
border-radius:18px;
text-align:center;
box-shadow:0 0 25px #ffc800;
animation:scalePop 0.7s ease;
}
@keyframes scalePop{
0%{transform:scale(0.4);opacity:0;}
70%{transform:scale(1.1);}
100%{transform:scale(1);opacity:1;}
}
.ach-title{font-size:22px;font-weight:bold;color:#222;margin-bottom:8px;}
.ach-desc{color:#666;margin-bottom:12px;}
.ach-happy{color:#ff5722;font-size:15px;}
.star-item{
position:absolute;
width:6px;
height:6px;
background:#ffd300;
border-radius:50%;
animation:starFly 1.3s ease-out forwards;
}
@keyframes starFly{
0%{opacity:1;}
100%{opacity:0;transform:translate(var(--tx),var(--ty));}
}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
