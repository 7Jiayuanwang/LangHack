version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: langhack-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: english_learning
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Initialize database with pre-packaged scripts if /var/lib/mysql is empty
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - langhack-network
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: langhack-backend
    restart: always
    environment:
      - TZ=Asia/Shanghai
      # Wait for MySQL to start
      - DB_URL=jdbc:mysql://mysql:3306/english_learning?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TENCENT_SECRET_ID=${TENCENT_SECRET_ID}
      - TENCENT_SECRET_KEY=${TENCENT_SECRET_KEY}
      - HIAGENT_API_KEY=${HIAGENT_API_KEY}
      - HIAGENT_APP_ID=${HIAGENT_APP_ID}
      - HIAGENT_API_URL=${HIAGENT_API_URL}
      - HIAGENT_QA_API_KEY=${HIAGENT_QA_API_KEY:-}
      - HIAGENT_QA_APP_ID=${HIAGENT_QA_APP_ID:-}
      - AI_TRANSLATE_API_KEY=${AI_TRANSLATE_API_KEY:-}
      - AI_TRANSLATE_API_URL=${AI_TRANSLATE_API_URL:-}
      - AI_TRANSLATE_MODEL=${AI_TRANSLATE_MODEL:-}
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - langhack-network
    volumes:
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass environment variables to the build process
        VITE_API_BASE_URL: /api
        VITE_TUTOR_API_BASE_URL: ${VITE_TUTOR_API_BASE_URL:-http://101.42.92.220/tutor}
    container_name: langhack-frontend
    restart: always
    ports:
      - "80:80"
      # Expose 443 if you add SSL certificates later
      # - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    networks:
      - langhack-network

networks:
  langhack-network:
    driver: bridge

volumes:
  mysql_data:
  backend_logs:
