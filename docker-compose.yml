services:
  mysql-master:
    image: mysql:8.0
    container_name: langhack-mysql-master
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: langhack
      MYSQL_REPLICATION_USER: repl
      MYSQL_REPLICATION_PASSWORD: replpass
    ports:
      - "3306:3306"
    volumes:
      - mysql-master-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - langhack-network

  mysql-slave:
    image: mysql:8.0
    container_name: langhack-mysql-slave
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: langhack
      MYSQL_REPLICATION_USER: repl
      MYSQL_REPLICATION_PASSWORD: replpass
    ports:
      - "3307:3306"
    volumes:
      - mysql-slave-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - langhack-network

  redis:
    image: redis:7-alpine
    container_name: langhack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - langhack-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: langhack-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-master:3306/langhack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123456
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_DATASOURCE_DYNAMIC_PRIMARY=master
      - SPRING_DATASOURCE_DYNAMIC_STRICT=false
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - langhack-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: langhack-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - langhack-network

volumes:
  mysql-master-data:
  mysql-slave-data:

networks:
  langhack-network:
    driver: bridge
