# LangHack 英语学习平台 - Nginx 生产配置
# 适用：4核8GB 应用服务器 + 独立算力服务器

user nginx;
worker_processes auto;        # 自动匹配 CPU 核心数
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;   # 每 worker 最大连接数
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志格式（含响应时间，用于性能分析）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;     # 媒体文件上传限制（与 Spring Boot 保持一致）
    server_tokens off;             # 隐藏 Nginx 版本号

    # Gzip 压缩（减少 60-70% 传输体积）
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_vary on;

    # ─── 限流区域定义 ───────────────────────────────────────────
    # 通用 API 限流：每 IP 20 req/s
    limit_req_zone $binary_remote_addr zone=api_general:20m rate=20r/s;

    # 翻译接口专项：每 IP 5 req/s（配合后端 50次/分钟限流双重保护）
    limit_req_zone $binary_remote_addr zone=api_translate:10m rate=5r/s;

    # AI 问答接口：每 IP 2 req/s（保护算力服务器）
    limit_req_zone $binary_remote_addr zone=api_tutor:10m rate=2r/s;

    # 登录接口防暴力破解：每 IP 1 req/s
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;

    # ─── Upstream 定义 ──────────────────────────────────────────
    upstream backend {
        server 127.0.0.1:8080;
        keepalive 32;           # 保持 32 个长连接到后端
    }

    upstream tutor_api {
        # 算力服务器 AI 接口地址（部署时替换为实际 IP）
        server TUTOR_SERVER_IP:8000;  # 替换为算力服务器地址
        keepalive 8;
    }

    # ─── HTTP → HTTPS 重定向 ────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS 主服务 ────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name your-domain.com;    # 替换为实际域名

        # SSL 证书配置（替换为实际证书路径）
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全响应头
        add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

        # ── 前端静态文件 ──
        root /var/www/langhack;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;  # Vue Router history 模式支持
        }

        # 静态资源强缓存（Vite 构建的 assets 含 hash，安全长期缓存）
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── AI 问答接口（算力服务器）──
        location /tutor {
            limit_req zone=api_tutor burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://tutor_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;   # AI 响应慢，超时放宽
            proxy_connect_timeout 10s;
        }

        # ── 翻译接口（严格限流）──
        location /api/translate {
            limit_req zone=api_translate burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # ── 认证接口（防暴力）──
        location /api/auth {
            limit_req zone=api_auth burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
        }

        # ── 媒体文件上传/下载 ──
        location /api/media {
            limit_req zone=api_general burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;   # 大文件上传超时放宽
            client_max_body_size 100M;
        }

        # ── GitHub Webhook（IP 白名单 + 限流）──
        location /webhook/ {
            # GitHub IP 白名单（由 scripts/update-github-ips.sh 自动维护）
            include /etc/nginx/github-ips.conf;
            deny all;

            limit_req zone=api_auth burst=3 nodelay;
            limit_req_status 429;

            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 15s;
        }

        # ── 通用 API（限流 + 反代）──
        location /api/ {
            limit_req zone=api_general burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";       # 启用 keepalive
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;

            # 后端不可用时返回 503 JSON（非 HTML）
            proxy_intercept_errors on;
            error_page 502 503 504 @backend_down;
        }

        location @backend_down {
            default_type application/json;
            return 503 '{"code":503,"message":"服务暂时不可用，请稍后重试","data":null}';
        }

        # 限流触发时返回 JSON（非默认 HTML）
        error_page 429 @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"code":429,"message":"请求过于频繁，请稍后重试","data":null}';
        }
    }
}
