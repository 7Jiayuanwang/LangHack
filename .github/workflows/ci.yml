name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Tests + Coverage
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: english_learning
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with JaCoCo coverage
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/english_learning?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: testpass
          JWT_SECRET: ci-test-secret-key-at-least-32-chars-long
          SPRING_PROFILES_ACTIVE: test
        run: mvn clean test -B

      - name: Run backend security scan (OWASP)
        working-directory: backend
        run: mvn dependency-check:check -DskipProvidedScope=true -DskipRuntimeScope=false || true

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const jacocoPath = './backend/target/site/jacoco/index.html';
            if (fs.existsSync(jacocoPath)) {
              const comment = `✅ Backend Coverage Report\n\n[View JaCoCo Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }})`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  frontend-test:
    name: Frontend Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests with v8 coverage
        working-directory: frontend
        run: npx vitest run --passWithNoTests --coverage

      - name: Run frontend security scan (npm audit)
        working-directory: frontend
        run: npm audit --production || true

      - name: Upload v8 coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vitest-coverage-report
          path: frontend/coverage/

      - name: Lint
        working-directory: frontend
        run: npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs --ignore-path .gitignore
        continue-on-error: true

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6

      - name: Build backend image
        run: docker build -t langhack-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t langhack-frontend:ci ./frontend
